<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abasthan Dashboard</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
    }

    main {
      text-align: center;
      padding: 40px 24px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    p { color: #94a3b8; }

    .status {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 16px;
      border-radius: 20px;
      background: #14532d;
      color: #86efac;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Abasthan Dashboard</h1>
    <p>Your application is running.</p>
    <div class="status">● System Online</div>
  </main>
</body>
</html>
